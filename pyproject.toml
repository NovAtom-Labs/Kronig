[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novatom-tcad-agent"
version = "0.1.0-alpha.12"
description = "Simulator-neutral TCAD research agent foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=46,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.2,<3",
  "pint>=0.26,<0.27",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
  "paramiko>=4,<5",
]

[project.optional-dependencies]
knowledge = ["fastembed>=0.7,<1"]
agent = [
  "openhands-sdk==1.49.4",
  "openhands-tools==1.49.4",
]
dev = [
  "mypy>=1.18,<2",
  "packaging>=26,<27",
  "pip-tools==7.5.2",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
tcad-agent = "tcad_agent.cli:main"
agent-kronig-desktop-backend = "tcad_agent.desktop.server:main"
agent-kronig-devsim = "tcad_agent.desktop.devsim_runner:main"
agent-kronig-build-sidecars = "tcad_agent.desktop.build_sidecars:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcad_agent = [
  "**/*.yaml",
  "**/*.j2",
  "web/templates/*.html",
  "web/static/*",
  "web/static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: invokes an installed simulator or subprocess boundary",
  "live_bedrock: invokes the configured Amazon Bedrock model",
  "sentaurus: invokes the configured licensed Sentaurus runner",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["tcad_agent"]
