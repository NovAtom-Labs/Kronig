name: Agent Kronig native alpha

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate version and tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python scripts/release_contract.py --root . --tag "${GITHUB_REF_NAME}"
          else
            python scripts/release_contract.py --root .
          fi

  build:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - name: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64

    runs-on: ${{ matrix.runner }}
    env:
      OPENHANDS_SUPPRESS_BANNER: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Python application and build tools
        run: python -m pip install --upgrade pip "pyinstaller==6.16.0" "devsim==2.9.1" -e ".[agent,knowledge,dev]"

      - name: Install Linux DEVSIM math runtime
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install Windows DEVSIM math runtime
        if: matrix.platform == 'win'
        run: python -m pip install "mkl==2025.2.0"

      - name: Configure simulator runtime
        run: python scripts/configure_ci_environment.py

      - name: Fetch pinned DEVSIM knowledge source
        shell: bash
        run: |
          mkdir -p devsim/source
          git -C devsim/source init
          git -C devsim/source remote add origin https://github.com/devsim/devsim.git
          git -C devsim/source fetch --depth 1 origin 43b41ca845184c47e22b72d144db7e7db8509377
          git -C devsim/source checkout --detach FETCH_HEAD
          test "$(git -C devsim/source rev-parse HEAD)" = "43b41ca845184c47e22b72d144db7e7db8509377"

      - name: Fetch pinned DEVSIM documentation
        shell: bash
        run: |
          mkdir -p devsim/documentation
          git -C devsim/documentation init
          git -C devsim/documentation remote add origin https://github.com/devsim/devsim_documentation.git
          git -C devsim/documentation fetch --depth 1 origin 8fbe81b5719307d654f37d630cf043dc6ae0512e
          git -C devsim/documentation checkout --detach FETCH_HEAD
          test "$(git -C devsim/documentation rev-parse HEAD)" = "8fbe81b5719307d654f37d630cf043dc6ae0512e"

      - name: Build reviewed knowledge index
        run: tcad-agent knowledge build --manifest knowledge-sources/manifests/sources.yaml --root . --index knowledge-sources/index/knowledge.sqlite3

      - name: Verify Python application
        run: python scripts/run_ci_pytest.py

      - name: Install locked desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Verify desktop shell
        run: python scripts/run_ci_desktop_tests.py

      - name: Build target-native Python sidecars
        run: python scripts/build_desktop_sidecars.py

      - name: Smoke test frozen DEVSIM sidecar
        run: python scripts/smoke_desktop_sidecars.py desktop/resources/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Scan unpacked sidecars for application credentials
        run: python scripts/inspect_desktop_artifacts.py desktop/resources/${{ matrix.platform == 'win' && 'win' || matrix.platform }}-${{ matrix.arch }}

      - name: Build native installers
        run: python scripts/build_native_installers.py ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_LINK || matrix.platform == 'win' && secrets.DESKTOP_WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ ((matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_LINK != '') || (matrix.platform == 'win' && secrets.DESKTOP_WINDOWS_CSC_LINK != '')) && 'true' || 'false' }}

      - name: Sign Linux update artifact
        if: matrix.platform == 'linux'
        run: python scripts/sign_linux_updates.py desktop/dist
        env:
          DESKTOP_LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_LINUX_SIGNING_PRIVATE_KEY }}

      - name: Inventory artifacts and reject embedded credentials
        run: python scripts/inspect_desktop_artifacts.py desktop/dist

      - name: Stage public release packages
        run: python scripts/release_artifacts.py stage desktop/dist desktop/release-stage "${{ matrix.platform }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-kronig-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/release-stage/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: agent-kronig-*
          path: release-downloads

      - name: Collect packages and checksums
        run: python scripts/release_artifacts.py collect release-downloads release-assets

      - name: Publish Agent Kronig alpha
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Agent Kronig 0.1.0 Alpha 12" \
            --notes-file docs/releases/v0.1.0-alpha.12.md \
            --prerelease \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
