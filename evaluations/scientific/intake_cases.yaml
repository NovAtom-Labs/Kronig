schema_version: "1.0"
purpose: Grade natural researcher intake without teaching the model product schema or backend internals
cases:
  - id: exact-bidirectional-junction
    title: Existing silicon stack under exact forward and reverse conditions
    prompt_file: prompts/exact-bidirectional-junction.md
    expected_status: ready
    expected_study: dc_points
    required_concepts: [exact_bias_points, preserve_requested_order, spatial_fields, failed_points_visible]
    forbidden_inventions: [new_geometry, changed_doping, changed_voltage]
    maximum_questions: 7

  - id: ambiguous-oxide-thickness
    title: Ambiguous oxide thickness and absolute capacitance request
    prompt_file: prompts/ambiguous-oxide-thickness.md
    expected_status: clarification
    expected_study: dc
    required_concepts: [unit, thickness, capacitance_normalization]
    forbidden_inventions: [silently_assume_nanometers, silently_assume_area]
    maximum_questions: 7

  - id: unsupported-contact-and-physics
    title: Explicit physics outside the reviewed DEVSIM implementation
    prompt_file: prompts/unsupported-contact-and-physics.md
    expected_status: blocked
    expected_study: equilibrium
    required_concepts: [unsupported_physics, metal_work_function, no_silent_substitution]
    forbidden_inventions: [replace_fermi_with_boltzmann, omit_auger, treat_schottky_as_ohmic]
    maximum_questions: 7

  - id: generic-layered-voltage-study
    title: Unfamiliar layer names with a supported voltage study
    prompt_file: prompts/generic-layered-voltage-study.md
    expected_status: ready
    expected_study: dc
    required_concepts: [ordered_regions, linear_profile, adaptive_sweep, canonical_datasets]
    forbidden_inventions: [named_device_mode, additional_material]
    maximum_questions: 7

  - id: incomplete-field-investigation
    title: Incomplete request that needs researcher-owned inputs
    prompt_file: prompts/incomplete-field-investigation.md
    expected_status: clarification
    required_concepts: [geometry, materials, contacts, applied_conditions, requested_outputs]
    forbidden_inventions: [typical_geometry, typical_doping, typical_bias]
    maximum_questions: 7

  - id: supported-oxide-charge-sweep
    title: Explicit silicon oxide stack with normalized capacitance
    prompt_file: prompts/supported-oxide-charge-sweep.md
    expected_status: ready
    expected_study: dc
    required_concepts: [silicon_dioxide, ideal_gate, terminal_charge, quasistatic_capacitance]
    forbidden_inventions: [metal_work_function, absolute_area]
    maximum_questions: 7

  - id: small-signal-dielectric-response
    title: Small-signal dielectric capacitance and complex current
    prompt_file: prompts/small-signal-dielectric-response.md
    expected_status: ready
    expected_study: ac
    required_concepts: [frequency, amplitude, complex_current, admittance, capacitance]
    forbidden_inventions: [dc_derivative_as_ac, absolute_area]
    maximum_questions: 7

  - id: dielectric-frequency-response
    title: Frequency-dependent dielectric response
    prompt_file: prompts/dielectric-frequency-response.md
    expected_status: ready
    expected_study: frequency
    required_concepts: [frequency_range, logarithmic_spacing, complex_admittance, conductance]
    forbidden_inventions: [unrequested_material_loss, arbitrary_frequency_points]
    maximum_questions: 7

  - id: transient-gate-ramp
    title: Time-domain dielectric gate ramp
    prompt_file: prompts/transient-gate-ramp.md
    expected_status: ready
    expected_study: transient
    required_concepts: [ramp, start_time, stop_time, maximum_step, terminal_charge]
    forbidden_inventions: [pulse_waveform, arbitrary_duration]
    maximum_questions: 7

  - id: temperature-dependent-carriers
    title: Explicit temperature list for an intrinsic semiconductor
    prompt_file: prompts/temperature-dependent-carriers.md
    expected_status: ready
    expected_study: temperature
    required_concepts: [exact_temperatures, rebuild_material_state, carrier_density, band_energy]
    forbidden_inventions: [interpolated_temperature, altered_geometry]
    maximum_questions: 7

  - id: lifetime-parameter-study
    title: Registered SRH lifetime sensitivity study
    prompt_file: prompts/lifetime-parameter-study.md
    expected_status: ready
    expected_study: parameter
    required_concepts: [registered_parameter, srh, lifetime, recombination]
    forbidden_inventions: [arbitrary_payload_path, unregistered_parameter]
    maximum_questions: 7

  - id: fermi-schottky-research-gate
    title: Degenerate statistics and direct Schottky request
    prompt_file: prompts/fermi-schottky-research-gate.md
    expected_status: blocked
    expected_study: dc
    required_concepts: [fermi_statistics, schottky_transport, unsupported_physics, no_silent_substitution]
    forbidden_inventions: [replace_fermi_with_boltzmann, replace_schottky_with_ohmic]
    maximum_questions: 7

  - id: supported-fermi-junction
    title: Degenerate silicon junction with ohmic contacts
    prompt_file: prompts/supported-fermi-junction.md
    expected_status: ready
    expected_study: dc
    required_concepts: [fermi_statistics, ohmic_initialization, coupled_transport, terminal_current]
    forbidden_inventions: [boltzmann_substitution, schottky_contact, changed_doping]
    maximum_questions: 7

  - id: supported-schottky-sweep
    title: Boltzmann thermionic metal silicon boundary
    prompt_file: prompts/supported-schottky-sweep.md
    expected_status: ready
    expected_study: dc_points
    required_concepts: [metal_work_function, thermionic_emission, richardson_constants, bias_polarity]
    forbidden_inventions: [ohmic_substitution, fermi_statistics, tunneling]
    maximum_questions: 7

  - id: supported-surface-physics
    title: Silicon oxide interface recombination and trap charge
    prompt_file: prompts/supported-surface-physics.md
    expected_status: ready
    expected_study: dc
    required_concepts: [surface_srh, capture_velocities, interface_trap, interface_charge]
    forbidden_inventions: [trap_distribution, tunneling, surface_mobility]
    maximum_questions: 7

  - id: supported-spatial-temperature
    title: Prescribed lattice temperature across a silicon stack
    prompt_file: prompts/supported-spatial-temperature.md
    expected_status: clarification
    expected_study: dc
    required_concepts: [physics.temperature, contacts.right]
    forbidden_inventions: [self_heating, scalar_temperature_substitution, fermi_statistics]
    maximum_questions: 7

  - id: supported-current-components
    title: Drift and diffusion diagnostics for Boltzmann transport
    prompt_file: prompts/supported-current-components.md
    expected_status: ready
    expected_study: dc_points
    required_concepts: [drift_current, diffusion_current, reconciliation_residual, boltzmann_statistics]
    forbidden_inventions: [fermi_decomposition, omit_native_total, force_zero_residual]
    maximum_questions: 7
